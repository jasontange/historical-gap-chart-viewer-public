<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historical Chart Viewer</title>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    body {
      display: flex;
      flex-direction: column;
      min-width: 960px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid #2a2a4a;
      background: #16213e;
    }
    .toolbar .field { display: flex; flex-direction: column; gap: 3px; }
    .toolbar label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .toolbar input {
      height: 32px;
      border-radius: 4px;
      font-size: 14px;
      border: 1px solid #2a2a4a;
      padding: 0 10px;
      background: #1a1a2e;
      color: #fff;
      width: 140px;
    }
    .toolbar input:focus { outline: none; border-color: #00d4aa; }
    .toolbar button {
      height: 32px;
      border-radius: 4px;
      font-size: 13px;
      border: none;
      padding: 0 18px;
      background: #00d4aa;
      color: #1a1a2e;
      font-weight: 700;
      cursor: pointer;
      align-self: flex-end;
    }
    .toolbar button:hover { background: #00f5c4; }
    .toolbar button:disabled { cursor: wait; opacity: 0.5; }
    .status { color: #888; font-size: 12px; align-self: flex-end; margin-left: 12px; }

    /* Main layout */
    .main-content {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .left-panel {
      display: flex;
      flex-direction: column;
      width: 58%;
      min-width: 500px;
      border-right: 1px solid #2a2a4a;
    }
    .right-panel {
      width: 42%;
      overflow-y: auto;
      padding: 12px 16px;
      background: #0f3460;
    }

    /* Chart */
    .chart-shell {
      height: 55%;
      min-height: 320px;
      border-bottom: 1px solid #2a2a4a;
    }
    .chart-title {
      height: 30px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: #00d4aa;
      border-bottom: 1px solid #2a2a4a;
      background: #16213e;
    }
    #chart {
      height: calc(100% - 30px);
      width: 100%;
      position: relative;
    }
    #session-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Gap table */
    .table-shell {
      flex: 1;
      min-height: 180px;
      overflow: auto;
      background: #16213e;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid #2a2a4a;
      padding: 7px 10px;
      text-align: left;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #1a1a2e;
      color: #00d4aa;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    tr { cursor: pointer; }
    tbody tr:hover { background: #1e3a5f; }
    tbody tr.selected { background: #1e3a5f; border-left: 3px solid #00d4aa; }
    .empty { padding: 18px 16px; color: #666; font-size: 13px; }

    .green { color: #00e676; font-weight: 600; }
    .red { color: #ff5252; font-weight: 600; }
    .yellow { color: #ffd740; font-weight: 600; }
    .orange { color: #ff9100; font-weight: 600; }

    /* Right panel - Edgar */
    .right-panel h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #00d4aa;
      border-bottom: 1px solid #2a2a4a;
      padding-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .edgar-section { margin-bottom: 20px; }
    .news-item, .offering-item {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 9px 11px;
      margin-bottom: 7px;
      font-size: 11px;
      line-height: 1.4;
    }
    .news-item:hover, .offering-item:hover { border-color: #00d4aa; }
    .news-meta { color: #777; font-size: 10px; margin-bottom: 3px; }
    .news-meta .form-type {
      background: #2a2a4a;
      padding: 1px 5px;
      border-radius: 3px;
      color: #00d4aa;
      font-weight: 500;
    }
    .news-headline { color: #e0e0e0; font-weight: 500; }
    .news-headline a { color: #4fc3f7; text-decoration: none; }
    .news-headline a:hover { text-decoration: underline; }
    .offering-detail { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
    .offering-detail .tag {
      background: #2a2a4a;
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10px;
    }
    .offering-detail .tag .lbl { color: #888; }
    .offering-detail .tag .val { color: #fff; font-weight: 500; }
    .loading-msg { color: #666; font-style: italic; font-size: 12px; }

    /* Dilution grid */
    .dilution-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
    }
    .dilution-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      background: #1a1a2e;
      border-radius: 4px;
      font-size: 11px;
    }
    .dilution-row .lbl { color: #888; }
    .dilution-row .val { font-weight: 600; color: #e0e0e0; }
    .dilution-row .val.red { color: #ff5252; }
    .dilution-row .val.green { color: #00e676; }
    .dilution-row .val.orange { color: #ff9100; }

    /* Tabs */
    .tab-bar {
      display: flex;
      gap: 0;
      background: #16213e;
      border-bottom: 1px solid #2a2a4a;
    }
    .tab-bar button {
      flex: 1;
      padding: 8px 0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: #888;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab-bar button:hover { color: #ccc; }
    .tab-bar button.active {
      color: #00d4aa;
      border-bottom-color: #00d4aa;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a2e; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a5a; }
  </style>
</head>
<body>
  <form class="toolbar" id="search-form">
    <div class="field">
      <label for="ticker">Ticker</label>
      <input id="ticker" name="ticker" placeholder="e.g. TDIC" autocomplete="off">
    </div>
    <button id="load-button" type="submit">Load</button>
    <div class="status" id="status"></div>
  </form>

  <div class="main-content">
    <div class="left-panel">
      <div class="tab-bar" id="tab-bar">
        <button class="active" data-tab="gaps">Gaps</button>
        <button data-tab="premarket">Premarket Movers</button>
        <button data-tab="afterhours">Afterhours Movers</button>
      </div>
      <section class="chart-shell">
        <div class="chart-title" id="chart-title">Search a ticker to begin</div>
        <div id="chart">
          <canvas id="session-overlay"></canvas>
        </div>
      </section>
      <section class="table-shell" id="table-shell">
        <div class="empty">Enter a ticker and click Load Gaps.</div>
      </section>
    </div>

    <div class="right-panel">
      <div class="edgar-section">
        <h3>Dilution Rating (as of selected date)</h3>
        <div id="dilution-container"><span class="loading-msg">Select a row to load dilution data.</span></div>
      </div>
      <div class="edgar-section">
        <h3>News &amp; Filings (3 days prior)</h3>
        <div id="news-container"><span class="loading-msg">Select a row to load news.</span></div>
      </div>
      <div class="edgar-section">
        <h3>Offerings (&plusmn; 30 days)</h3>
        <div id="offerings-container"><span class="loading-msg">Select a row to load offerings.</span></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('search-form');
    const tickerInput = document.getElementById('ticker');
    const loadButton = document.getElementById('load-button');
    const statusEl = document.getElementById('status');
    const tableShell = document.getElementById('table-shell');
    const chartTitle = document.getElementById('chart-title');
    const chartContainer = document.getElementById('chart');
    const overlay = document.getElementById('session-overlay');
    const overlayContext = overlay.getContext('2d');
    const newsContainer = document.getElementById('news-container');
    const offeringsContainer = document.getElementById('offerings-container');
    const dilutionContainer = document.getElementById('dilution-container');
    const tabBar = document.getElementById('tab-bar');

    let chart;
    let candleSeries;
    let vwapSeries;
    let volumeSeries;
    let eventLines = [];
    let extendedRanges = [];
    let selectedRowEl = null;
    let currentTicker = '';
    let activeTab = 'gaps';

    const TAB_CONFIG = {
      gaps:       { api: '/api/gaps',              label: 'Gaps',              emptyMsg: 'No gap days returned.' },
      premarket:  { api: '/api/premarket-stats',   label: 'Premarket Movers',  emptyMsg: 'No premarket movers returned.' },
      afterhours: { api: '/api/afterhours-stats',  label: 'Afterhours Movers', emptyMsg: 'No afterhours movers returned.' },
    };

    function setStatus(msg) { statusEl.textContent = msg || ''; }

    function fmtDollarVol(val) {
      if (val == null) return '';
      if (val >= 1e6) return '$' + (val / 1e6).toFixed(1) + 'M';
      if (val >= 1e3) return '$' + (val / 1e3).toFixed(0) + 'K';
      return '$' + Number(val).toLocaleString();
    }

    let gapDatesCache = new Set(); // gap dates for the current ticker

    function nextTradingDay(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      const day = d.getDay(); // 0=Sun..6=Sat
      // Friday(5) -> Monday(+3), Saturday(6) -> Monday(+2), otherwise +1
      const add = day === 5 ? 3 : day === 6 ? 2 : 1;
      d.setDate(d.getDate() + add);
      return d.toISOString().split('T')[0];
    }

    // ===== TABS =====
    tabBar.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-tab]');
      if (!btn || btn.dataset.tab === activeTab) return;
      tabBar.querySelector('.active').classList.remove('active');
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      // Re-load data if we have a ticker
      if (currentTicker) loadData();
    });

    // ===== TABLE RENDERERS =====
    function buildRowClickHandler(tr, ticker) {
      tr.addEventListener('click', () => {
        if (!tr.dataset.date) { setStatus('Row missing date.'); return; }
        if (selectedRowEl) selectedRowEl.classList.remove('selected');
        selectedRowEl = tr;
        tr.classList.add('selected');
        loadChart(ticker, tr.dataset.date);
        loadEdgarData(ticker, tr.dataset.date);
      });
    }

    function renderGapsTable(rows, ticker) {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tbody = document.createElement('tbody');
      thead.innerHTML = `<tr>
        <th>Date</th><th>Volume</th><th>Premarket Vol</th><th>Gap %</th>
        <th>Close</th><th>Over VWAP</th><th>Filing Types</th><th>Tags</th>
      </tr>`;

      rows.forEach((row) => {
        const tr = document.createElement('tr');
        const chartDate = row._chart_date || row.date || '';
        tr.dataset.date = chartDate;

        const gapPct = row.gap_percentage || 0;
        let gapClass = 'orange';
        if (gapPct >= 75) gapClass = 'green';
        else if (gapPct >= 50) gapClass = 'yellow';

        const mClose = row.market_close;
        const mOpen = row.market_open;
        let closeClass = 'yellow';
        if (mClose > mOpen) closeClass = 'green';
        else if (mClose < mOpen) closeClass = 'red';

        const overVwap = row.closed_over_vwap;
        let vwapClass = overVwap ? 'green' : 'red';
        let vwapText = overVwap ? 'Yes' : 'No';

        const filingTypes = Array.isArray(row.filing_types) ? row.filing_types.join(', ') : (row.filing_types || '');
        const tags = Array.isArray(row.all_tags) ? row.all_tags.join(', ') : (row.all_tags || '');

        tr.innerHTML = `
          <td>${chartDate}</td>
          <td>${row.volume ? Number(row.volume).toLocaleString() : ''}</td>
          <td>${row.premarket_volume ? Number(row.premarket_volume).toLocaleString() : ''}</td>
          <td class="${gapClass}">${gapPct.toFixed(2)}%</td>
          <td class="${closeClass}">$${mClose ? Number(mClose).toFixed(2) : 'N/A'}</td>
          <td class="${vwapClass}">${vwapText}</td>
          <td>${filingTypes}</td>
          <td>${tags}</td>`;

        buildRowClickHandler(tr, ticker);
        tbody.appendChild(tr);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      return { table, tbody };
    }

    function renderPremarketTable(rows, ticker) {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tbody = document.createElement('tbody');
      thead.innerHTML = `<tr>
        <th>Date</th><th>Gain %</th><th>Spike (min)</th><th>PM $ Volume</th>
        <th>Closed Over VWAP</th><th>Gapped?</th><th>Filing Types</th><th>Tags</th>
      </tr>`;

      rows.forEach((row) => {
        const tr = document.createElement('tr');
        const chartDate = row._chart_date || row.date || '';
        tr.dataset.date = chartDate;

        const gain = row.percentage_gain || 0;
        let gainClass = gain > 0 ? 'green' : (gain < 0 ? 'red' : '');

        const mOpen = row.market_open;
        const pmVwap = row.premarket_vwap;
        let vwapClass = '';
        let vwapText = 'N/A';
        if (mOpen != null && pmVwap != null) {
          vwapClass = mOpen >= pmVwap ? 'green' : 'red';
          vwapText = mOpen >= pmVwap ? 'Yes' : 'No';
        }

        // Premarket date matches gap date directly
        const gapped = chartDate && gapDatesCache.has(chartDate);

        const filingTypes = Array.isArray(row.filing_types) ? row.filing_types.join(', ') : (row.filing_types || '');
        const tags = Array.isArray(row.all_tags) ? row.all_tags.join(', ') : (row.all_tags || '');

        tr.innerHTML = `
          <td>${chartDate}</td>
          <td class="${gainClass}">${gain.toFixed(2)}%</td>
          <td>${row.spike_duration_minutes != null ? row.spike_duration_minutes : ''}</td>
          <td>${fmtDollarVol(row.premarket_dollar_volume)}</td>
          <td class="${vwapClass}">${vwapText}</td>
          <td class="${gapped ? 'green' : ''}">${gapped ? 'Yes' : 'No'}</td>
          <td>${filingTypes}</td>
          <td>${tags}</td>`;

        buildRowClickHandler(tr, ticker);
        tbody.appendChild(tr);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      return { table, tbody };
    }

    function renderAfterhoursTable(rows, ticker) {
      const table = document.createElement('table');
      const thead = document.createElement('thead');
      const tbody = document.createElement('tbody');
      thead.innerHTML = `<tr>
        <th>Date</th><th>Gain %</th><th>Spike (min)</th><th>AH $ Volume</th>
        <th>Closed Over VWAP</th><th>Gapped?</th><th>Filing Types</th><th>Tags</th>
      </tr>`;

      rows.forEach((row) => {
        const tr = document.createElement('tr');
        const chartDate = row._chart_date || row.date || '';
        tr.dataset.date = chartDate;

        const gain = row.percentage_gain || 0;
        let gainClass = gain > 0 ? 'green' : (gain < 0 ? 'red' : '');

        const ahClose = row.afterhours_close;
        const ahVwap = row.afterhours_vwap;
        let vwapClass = '';
        let vwapText = 'N/A';
        if (ahClose != null && ahVwap != null) {
          vwapClass = ahClose >= ahVwap ? 'green' : 'red';
          vwapText = ahClose >= ahVwap ? 'Yes' : 'No';
        }

        // AH move on day X → gap would show on the next trading day
        const gapped = chartDate && gapDatesCache.has(nextTradingDay(chartDate));

        const filingTypes = Array.isArray(row.filing_types) ? row.filing_types.join(', ') : (row.filing_types || '');
        const tags = Array.isArray(row.all_tags) ? row.all_tags.join(', ') : (row.all_tags || '');

        tr.innerHTML = `
          <td>${chartDate}</td>
          <td class="${gainClass}">${gain.toFixed(2)}%</td>
          <td>${row.spike_duration_minutes != null ? row.spike_duration_minutes : ''}</td>
          <td>${fmtDollarVol(row.afterhours_dollar_volume)}</td>
          <td class="${vwapClass}">${vwapText}</td>
          <td class="${gapped ? 'green' : ''}">${gapped ? 'Yes' : 'No'}</td>
          <td>${filingTypes}</td>
          <td>${tags}</td>`;

        buildRowClickHandler(tr, ticker);
        tbody.appendChild(tr);
      });

      table.appendChild(thead);
      table.appendChild(tbody);
      return { table, tbody };
    }

    function renderTable(rows, ticker) {
      const config = TAB_CONFIG[activeTab];
      if (!rows.length) {
        tableShell.innerHTML = `<div class="empty">${config.emptyMsg}</div>`;
        return;
      }

      let result;
      if (activeTab === 'premarket') result = renderPremarketTable(rows, ticker);
      else if (activeTab === 'afterhours') result = renderAfterhoursTable(rows, ticker);
      else result = renderGapsTable(rows, ticker);

      tableShell.replaceChildren(result.table);
      const firstRow = result.tbody.querySelector('tr[data-date]');
      if (firstRow) firstRow.click();
    }

    // ===== CHART =====
    function ensureChart(labels) {
      if (chart) chart.remove();
      chart = LightweightCharts.createChart(chartContainer, {
        layout: {
          background: { type: 'solid', color: '#1a1a2e' },
          textColor: '#e0e0e0'
        },
        grid: {
          vertLines: { color: '#2a2a4a' },
          horzLines: { color: '#2a2a4a' }
        },
        rightPriceScale: { borderColor: '#2a2a4a' },
        timeScale: {
          borderColor: '#2a2a4a',
          timeVisible: true,
          secondsVisible: false,
          tickMarkFormatter: (time) => labels[String(time)] || ''
        },
        localization: {
          timeFormatter: (time) => labels[String(time)] || ''
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
      });

      candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: '#00e676',
        downColor: '#ff5252',
        borderUpColor: '#00e676',
        borderDownColor: '#ff5252',
        wickUpColor: '#00e676',
        wickDownColor: '#ff5252'
      });
      vwapSeries = chart.addSeries(LightweightCharts.LineSeries, {
        color: '#ffab40',
        lineWidth: 2,
        priceLineVisible: false
      });
      volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
        priceFormat: { type: 'volume' },
        priceScaleId: 'volume',
        priceLineVisible: false
      });
      chart.priceScale('volume').applyOptions({
        scaleMargins: { top: 0.78, bottom: 0 }
      });
      chart.timeScale().subscribeVisibleLogicalRangeChange(drawSessions);
    }

    function resizeOverlay() {
      const rect = chartContainer.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      overlay.width = Math.floor(rect.width * dpr);
      overlay.height = Math.floor(rect.height * dpr);
      overlay.style.width = `${rect.width}px`;
      overlay.style.height = `${rect.height}px`;
      overlayContext.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawSessions() {
      resizeOverlay();
      if (!chart) return;
      const width = overlay.clientWidth;
      const height = overlay.clientHeight;
      overlayContext.clearRect(0, 0, width, height);

      extendedRanges.forEach((range) => {
        const startX = chart.timeScale().timeToCoordinate(range.start);
        const endX = chart.timeScale().timeToCoordinate(range.end);
        if (startX === null || endX === null) return;
        const left = Math.max(0, Math.min(startX, endX));
        const right = Math.min(width, Math.max(startX, endX));
        if (right <= 0 || left >= width) return;
        overlayContext.fillStyle = 'rgba(15, 52, 96, 0.4)';
        overlayContext.fillRect(left, 0, right - left, height);
      });

      eventLines.forEach((ev) => {
        const x = chart.timeScale().timeToCoordinate(ev.time);
        if (x === null || x < 0 || x > width) return;
        overlayContext.beginPath();
        overlayContext.setLineDash([5, 5]);
        overlayContext.strokeStyle = ev.color;
        overlayContext.lineWidth = 1;
        overlayContext.moveTo(x, 0);
        overlayContext.lineTo(x, height);
        overlayContext.stroke();
        overlayContext.setLineDash([]);
      });
    }

    async function loadChart(ticker, date) {
      setStatus(`Loading chart for ${ticker} ${date}...`);
      try {
        const resp = await fetch(`/api/chart?ticker=${encodeURIComponent(ticker)}&date=${encodeURIComponent(date)}&candleMinutes=3`);
        const payload = await resp.json();
        if (!resp.ok) throw new Error(payload.error || 'Chart load failed.');

        chartTitle.textContent = payload.title;
        eventLines = payload.eventLines || [];
        extendedRanges = payload.extendedRanges || [];
        ensureChart(payload.labels || {});
        candleSeries.setData(payload.candles || []);
        vwapSeries.setData(payload.vwap || []);
        volumeSeries.setData(payload.volume || []);
        chart.timeScale().fitContent();
        drawSessions();
        setStatus(`${ticker} ${date}`);
      } catch (err) {
        setStatus(err.message);
      }
    }

    // ===== EDGAR DATA =====
    async function loadEdgarData(ticker, selectedDate) {
      loadDilution(ticker, selectedDate);
      loadNews(ticker, selectedDate);
      loadOfferings(ticker, selectedDate);
    }

    async function loadDilution(ticker, selectedDate) {
      dilutionContainer.innerHTML = '<span class="loading-msg">Loading dilution data...</span>';
      try {
        const resp = await fetch(`/api/dilution?ticker=${encodeURIComponent(ticker)}&date=${encodeURIComponent(selectedDate)}`);
        const json = await resp.json();
        if (!resp.ok) throw new Error(json.error || 'Failed');

        const results = json.results || [];
        if (!results.length) {
          dilutionContainer.innerHTML = '<span class="loading-msg">No dilution data found.</span>';
          return;
        }

        const d = results[0];
        function riskColor(val) {
          if (!val) return '';
          const v = val.toLowerCase();
          if (v === 'high' || v === 'severe' || v === 'frequent') return 'red';
          if (v === 'moderate' || v === 'medium') return 'orange';
          if (v === 'low' || v === 'minimal' || v === 'none') return 'green';
          return '';
        }
        function boolColor(val) { return val ? 'red' : ''; }
        function boolText(val) { return val ? 'Yes' : 'No'; }
        function fmtCash(val) {
          if (val == null) return 'N/A';
          if (val >= 1e6) return '$' + (val / 1e6).toFixed(1) + 'M';
          if (val >= 1e3) return '$' + (val / 1e3).toFixed(0) + 'K';
          return '$' + val.toLocaleString();
        }

        dilutionContainer.innerHTML = `
          <div class="dilution-grid">
            <div class="dilution-row"><span class="lbl">Overall Offering Risk</span><span class="val ${riskColor(d.overall_offering_risk)}">${d.overall_offering_risk || 'N/A'}</span></div>
            <div class="dilution-row"><span class="lbl">Cash Need</span><span class="val ${riskColor(d.cash_need)}">${d.cash_need || 'N/A'}</span></div>
            <div class="dilution-row"><span class="lbl">Offering Ability</span><span class="val ${riskColor(d.offering_ability)}">${d.offering_ability || 'N/A'}</span></div>
            <div class="dilution-row"><span class="lbl">Offering Frequency</span><span class="val ${riskColor(d.offering_frequency)}">${d.offering_frequency || 'N/A'}</span></div>
            <div class="dilution-row"><span class="lbl">Dilution</span><span class="val ${riskColor(d.dilution)}">${d.dilution || 'N/A'}</span></div>
            <div class="dilution-row"><span class="lbl">Estimated Cash</span><span class="val">${fmtCash(d.estimated_cash)}</span></div>
            <div class="dilution-row"><span class="lbl">Cash Remaining (months)</span><span class="val">${d.cash_remaining_months != null ? d.cash_remaining_months.toFixed(1) : 'N/A'}</span></div>
            <div class="dilution-row"><span class="lbl">Cash Burn</span><span class="val">${fmtCash(d.cash_burn)}</span></div>
            <div class="dilution-row"><span class="lbl">Shelf Capacity</span><span class="val">${fmtCash(d.shelf_capacity)}</span></div>
            <div class="dilution-row"><span class="lbl">Offerings (2yr)</span><span class="val">${d.offering_count_2y != null ? d.offering_count_2y : 'N/A'}</span></div>
            <div class="dilution-row"><span class="lbl">Has Pending S-1</span><span class="val ${boolColor(d.has_pending_s1)}">${boolText(d.has_pending_s1)}</span></div>
            <div class="dilution-row"><span class="lbl">RegSHO</span><span class="val ${boolColor(d.regsho)}">${boolText(d.regsho)}</span></div>
          </div>`;
      } catch (err) {
        dilutionContainer.innerHTML = `<span class="loading-msg">Error: ${err.message}</span>`;
      }
    }

    async function loadNews(ticker, selectedDate) {
      newsContainer.innerHTML = '<span class="loading-msg">Loading news...</span>';
      const d = new Date(selectedDate + 'T00:00:00');
      const startD = new Date(d);
      startD.setDate(startD.getDate() - 3);
      const fromStr = startD.toISOString().split('T')[0];

      try {
        const resp = await fetch(`/api/news?ticker=${encodeURIComponent(ticker)}&date_from=${fromStr}&date_to=${encodeURIComponent(selectedDate)}`);
        const json = await resp.json();
        if (!resp.ok) throw new Error(json.error || 'Failed');

        const excluded = ['grok', 'jmt415'];
        const filtered = (json.results || []).filter(item => {
          return !excluded.includes((item.form_type || '').toLowerCase());
        });

        if (!filtered.length) {
          newsContainer.innerHTML = '<span class="loading-msg">No news found for this period.</span>';
          return;
        }

        newsContainer.innerHTML = filtered.map(item => {
          const time = item.filed_at_time ? new Date(item.filed_at_time).toLocaleString() : item.filed_at;
          return `<div class="news-item">
            <div class="news-meta">${time} &bull; <span class="form-type">${item.form_type || 'N/A'}</span></div>
            <div class="news-headline"><a href="${item.url}" target="_blank">${(item.form_type || '').toLowerCase() === 'news' ? (item.title || 'Untitled') : (item.headline || 'Untitled')}</a></div>
          </div>`;
        }).join('');
      } catch (err) {
        newsContainer.innerHTML = `<span class="loading-msg">Error: ${err.message}</span>`;
      }
    }

    async function loadOfferings(ticker, selectedDate) {
      offeringsContainer.innerHTML = '<span class="loading-msg">Loading offerings...</span>';
      const d = new Date(selectedDate + 'T00:00:00');
      const dateFrom = new Date(d);
      dateFrom.setDate(dateFrom.getDate() - 30);
      const dateTo = new Date(d);
      dateTo.setDate(dateTo.getDate() + 30);
      const fromStr = dateFrom.toISOString().split('T')[0];
      const toStr = dateTo.toISOString().split('T')[0];

      try {
        const resp = await fetch(`/api/offerings?ticker=${encodeURIComponent(ticker)}&date_from=${fromStr}&date_to=${toStr}`);
        const json = await resp.json();
        if (!resp.ok) throw new Error(json.error || 'Failed');

        const results = json.results || [];
        if (!results.length) {
          offeringsContainer.innerHTML = '<span class="loading-msg">No offerings found within 30 days.</span>';
          return;
        }

        offeringsContainer.innerHTML = results.map(item => {
          const amount = item.offering_amount ? '$' + Number(item.offering_amount).toLocaleString() : 'N/A';
          const price = item.share_price ? '$' + Number(item.share_price).toFixed(2) : 'N/A';
          const shares = item.shares_amount ? Number(item.shares_amount).toLocaleString() : 'N/A';
          const details = item.selling_shareholder_details || 'N/A';
          return `<div class="offering-item">
            <div class="news-meta">${item.filed_at || 'N/A'}</div>
            <div class="news-headline"><a href="${item.askedgar_url || '#'}" target="_blank">${item.headline || 'Untitled'}</a></div>
            <div class="offering-detail">
              <span class="tag"><span class="lbl">Amount: </span><span class="val">${amount}</span></span>
              <span class="tag"><span class="lbl">Price: </span><span class="val">${price}</span></span>
              <span class="tag"><span class="lbl">Shares: </span><span class="val">${shares}</span></span>
              <span class="tag"><span class="lbl">Details: </span><span class="val">${details}</span></span>
            </div>
          </div>`;
        }).join('');
      } catch (err) {
        offeringsContainer.innerHTML = `<span class="loading-msg">Error: ${err.message}</span>`;
      }
    }

    // ===== LOAD DATA =====
    async function loadData(event) {
      if (event) event.preventDefault();
      const ticker = tickerInput.value.trim().toUpperCase();
      if (!ticker) return;
      currentTicker = ticker;

      const config = TAB_CONFIG[activeTab];
      selectedRowEl = null;
      loadButton.disabled = true;
      setStatus(`Loading ${config.label.toLowerCase()} for ${ticker}...`);
      tableShell.innerHTML = `<div class="empty">Loading ${config.label.toLowerCase()}...</div>`;
      newsContainer.innerHTML = '<span class="loading-msg">Select a row to load news.</span>';
      offeringsContainer.innerHTML = '<span class="loading-msg">Select a row to load offerings.</span>';
      dilutionContainer.innerHTML = '<span class="loading-msg">Select a row to load dilution data.</span>';

      try {
        // Fetch tab data; also fetch gap dates in parallel for premarket/afterhours
        const fetches = [
          fetch(config.api, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticker })
          })
        ];
        if (activeTab !== 'gaps') {
          fetches.push(
            fetch('/api/gaps', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ticker })
            })
          );
        }
        const responses = await Promise.all(fetches);
        const payload = await responses[0].json();
        if (!responses[0].ok) throw new Error(payload.error || `Could not load ${config.label.toLowerCase()}.`);

        // Build gap dates set for cross-referencing
        if (responses[1]) {
          const gapPayload = await responses[1].json();
          gapDatesCache = new Set(
            (gapPayload.rows || []).map(r => r._chart_date || r.date || '').filter(Boolean)
          );
        } else {
          gapDatesCache = new Set();
        }

        renderTable(payload.rows || [], ticker);
        setStatus(`${(payload.rows || []).length} ${config.label.toLowerCase()} for ${ticker}`);
      } catch (err) {
        tableShell.innerHTML = `<div class="empty">${err.message}</div>`;
        chartTitle.textContent = 'Search a ticker to begin';
        setStatus(err.message);
      } finally {
        loadButton.disabled = false;
      }
    }

    form.addEventListener('submit', loadData);
    window.addEventListener('resize', () => {
      if (!chart) return;
      chart.applyOptions({ width: chartContainer.clientWidth, height: chartContainer.clientHeight });
      drawSessions();
    });
  </script>
</body>
</html>
